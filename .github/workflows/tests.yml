name: SwissTrail tests

on:
  push:
    branches: [main, feature/swisstrail-v3-safe-migration]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SwissTrail_HSLU_Projekt_V2/swisstrail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
